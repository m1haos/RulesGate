# Показывается перед входом в мир. Форматирование MiniMessage, один пункт списка — один абзац.
# Игрок получает файл по языку своего клиента (ru.yml для русского и т. д.), иначе — файл языка
# из config.yml. Чтобы перевести правила, добавьте файл с кодом нужного языка.
title: "<gold>Правила сервера"

body:
  - "<white>1.</white> Уважайте других игроков. Без оскорблений, угроз и травли."
  - "<white>2.</white> Никаких читов, x-ray и других нечестных модов."
  - "<white>3.</white> Не ломайте и не воруйте чужие постройки."
  - "<white>4.</white> Без рекламы других серверов."
  - "<gray>За нарушения — мут или бан. Вопросы задавайте администрации в Discord."

accept: "<green>Принимаю"
decline: "<red>Не принимаю"
close: "Закрыть"
